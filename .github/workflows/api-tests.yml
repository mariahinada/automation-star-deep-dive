name: API Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Start API in background
        run: npm start &
        env:
          PORT: 3000

      - name: Wait until API is running
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... (attempt ${attempt}/30)"
            sleep 1
          done
          echo "API health check failed"
          exit 1

      - name: Run tests
        run: |
          npx mocha test/pathCoverage/**/*.test.js \
            --reporter mochawesome \
            --reporter-options reportDir=mochawesome-report,reportFilename=path-coverage-report \
            --timeout 10000
        env:
          PORT: 3000
          API_BASE_URL: http://localhost:3000
